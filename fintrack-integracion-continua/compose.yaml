# FinTrack: tres contenedores en la red fintrack.
# El navegador usa los puertos publicados. El backend habla con PostgreSQL por el nombre "db".

name: fintrack

services:
  db:
    image: postgres:16-alpine
    container_name: fintrack-db
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack
      POSTGRES_DB: fintrack
    volumes:
      - fintrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - fintrack
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: fintrack-backend
    environment:
      DATABASE_URL: postgresql://fintrack:fintrack@db:5432/fintrack?schema=public
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - fintrack
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: fintrack-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fintrack
    restart: unless-stopped

networks:
  fintrack:
    name: fintrack
    driver: bridge

volumes:
  fintrack-db:
    name: fintrack-db
